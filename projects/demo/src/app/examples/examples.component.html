<app-header tagline="Interactive Examples"></app-header>

<section class="examples-page">
  <div class="container">
    <div class="intro">
      <h1>Examples</h1>
      <p class="lead">
        Three ways to use ng-whiteboard: the bare canvas, the complete whiteboard as it ships, and your own interface on
        top of the service API.
      </p>
    </div>

    <div class="example-section">
      <div class="example-header">
        <h2 id="canvas-only">
          <a class="anchor" [routerLink]="['/examples']" fragment="canvas-only" aria-label="Canvas only example">#</a>
          Canvas Only
        </h2>
      </div>
      <div class="example-content">
        <div class="demo">
          <app-minimal-component></app-minimal-component>
        </div>
      </div>
    </div>

    <div class="example-section">
      <div class="example-header">
        <h2 id="out-of-the-box">
          <a class="anchor" [routerLink]="['/examples']" fragment="out-of-the-box" aria-label="Out of the box example"
            >#</a
          >
          Out of the Box
        </h2>
      </div>
      <div class="example-content">
        <div class="demo">
          <app-out-of-the-box></app-out-of-the-box>
        </div>
      </div>
    </div>

    <div class="example-section">
      <div class="example-header">
        <h2 id="custom-interface">
          <a
            class="anchor"
            [routerLink]="['/examples']"
            fragment="custom-interface"
            aria-label="Custom interface example"
            >#</a
          >
          Custom Interface
        </h2>
      </div>
      <div class="example-content">
        <div class="demo">
          <app-custom-editor></app-custom-editor>
        </div>
      </div>
    </div>
  </div>
</section>
